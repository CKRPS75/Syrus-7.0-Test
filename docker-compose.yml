version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: trustroute_db
    environment:
      POSTGRES_USER: trustroute
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trustroute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustroute -d trustroute"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustroute_backend
    environment:
      DATABASE_URL: postgresql+psycopg://trustroute:password@db:5432/trustroute
      APP_ENV: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
